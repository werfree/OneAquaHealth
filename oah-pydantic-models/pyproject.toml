[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oah-pydantic-models"
version = "0.1.0"
description = "Pydantic models for the 7 OneAquaHealth (OAH) logical models"
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
