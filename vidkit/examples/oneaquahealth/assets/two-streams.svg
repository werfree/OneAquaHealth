<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"
     aria-label="Two evidence streams — environmental measurements (daily) and notified population health (weekly) — meeting at the shared FHIR Location yam-ito.">
  <defs>
    <linearGradient id="accW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FB2"/><stop offset="1" stop-color="#4FA3D8"/>
    </linearGradient>
    <linearGradient id="accH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B05A2A"/><stop offset="1" stop-color="#D98D52"/>
    </linearGradient>
    <style>
      .ink   { fill:#16232B; font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .muted { fill:#5B6B75; font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .mono  { font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1600" height="6" fill="url(#accW)"/>

  <text class="ink" x="80" y="92" font-size="40" font-weight="800">Two kinds of evidence, one Location</text>
  <text class="muted" x="80" y="136" font-size="24">Different producers, different cadence — resolved to the same FHIR Location.</text>

  <!-- ===== Environmental lane ===== -->
  <g transform="translate(80,220)">
    <rect x="0" y="0" width="820" height="150" rx="14" fill="#FFFFFF" stroke="#E3DED3"/>
    <circle cx="44" cy="46" r="20" fill="#EAF3FB"/>
    <text x="44" y="54" font-size="24" text-anchor="middle">&#128167;</text>
    <text class="ink" x="84" y="44" font-size="28" font-weight="700">Environmental measurements</text>
    <text class="muted" x="84" y="78" font-size="21">faecal coliform · BOD · dissolved oxygen</text>
    <text class="muted" x="84" y="108" font-size="21">daily in-situ samples — 28 readings / station</text>

    <!-- daily tick marks (dense) -->
    <g>
      <line x1="470" y1="120" x2="800" y2="120" stroke="#1F6FB2" stroke-width="2"/>
      <g fill="#1F6FB2">
        <circle cx="476" cy="120" r="3"/><circle cx="487" cy="120" r="3"/><circle cx="498" cy="120" r="3"/>
        <circle cx="509" cy="120" r="3"/><circle cx="520" cy="120" r="3"/><circle cx="531" cy="120" r="3"/>
        <circle cx="542" cy="120" r="3"/><circle cx="553" cy="120" r="3"/><circle cx="564" cy="120" r="3"/>
        <circle cx="575" cy="120" r="3"/><circle cx="586" cy="120" r="3"/><circle cx="597" cy="120" r="3"/>
        <circle cx="608" cy="120" r="3"/><circle cx="619" cy="120" r="3"/><circle cx="630" cy="120" r="3"/>
        <circle cx="641" cy="120" r="3"/><circle cx="652" cy="120" r="3"/><circle cx="663" cy="120" r="3"/>
        <circle cx="674" cy="120" r="3"/><circle cx="685" cy="120" r="3"/><circle cx="696" cy="120" r="3"/>
        <circle cx="707" cy="120" r="3"/><circle cx="718" cy="120" r="3"/><circle cx="729" cy="120" r="3"/>
        <circle cx="740" cy="120" r="3"/><circle cx="751" cy="120" r="3"/><circle cx="762" cy="120" r="3"/>
        <circle cx="773" cy="120" r="3"/>
      </g>
      <text class="muted" x="470" y="146" font-size="17">daily cadence — 28 ticks</text>
    </g>
  </g>

  <!-- ===== Health lane ===== -->
  <g transform="translate(80,470)">
    <rect x="0" y="0" width="820" height="150" rx="14" fill="#FFFFFF" stroke="#E3DED3"/>
    <circle cx="44" cy="46" r="20" fill="#FBEFE6"/>
    <text x="44" y="54" font-size="24" text-anchor="middle">&#127973;</text>
    <text class="ink" x="84" y="44" font-size="28" font-weight="700">Notified population health</text>
    <text class="muted" x="84" y="78" font-size="21">acute diarrhoeal disease, per 100,000</text>
    <text class="muted" x="84" y="108" font-size="21">weekly surveillance returns — 4 points in window</text>

    <!-- weekly tick marks (sparse) -->
    <g>
      <line x1="470" y1="120" x2="800" y2="120" stroke="#B05A2A" stroke-width="2"/>
      <g fill="#B05A2A">
        <circle cx="490" cy="120" r="5"/><circle cx="590" cy="120" r="5"/>
        <circle cx="690" cy="120" r="5"/><circle cx="790" cy="120" r="5"/>
      </g>
      <text class="muted" x="470" y="146" font-size="17">weekly cadence — 4 points</text>
    </g>
  </g>

  <!-- convergence into shared location -->
  <g fill="none" stroke="#8A99A3" stroke-width="2.5">
    <path d="M905,295 C1000,295 1045,392 1136,410" marker-end="url(#arrow)"/>
    <path d="M905,545 C1000,545 1045,448 1136,430" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A99A3"/>
    </marker>
  </defs>

  <!-- shared location node -->
  <g transform="translate(1140,310)">
    <rect x="0" y="0" width="380" height="220" rx="16" fill="#16232B"/>
    <text x="28" y="52" font-size="22" fill="#8FBEDC" font-weight="700" letter-spacing="1">SHARED FHIR LOCATION</text>
    <text x="28" y="104" font-size="34" fill="#FFFFFF" font-weight="800" class="mono">yam-ito</text>
    <text x="28" y="146" font-size="21" fill="#C7D3DA">Yamuna at ITO Bridge</text>
    <text x="28" y="176" font-size="21" fill="#C7D3DA">Central Delhi · reach flow_km 12</text>
    <text x="28" y="206" font-size="19" fill="#8FBEDC" class="mono">meta.tag · oah-demo-final</text>
  </g>

  <!-- note -->
  <text class="muted" x="80" y="740" font-size="24">
    A shared Location makes the two streams joinable — but the differing cadence is why any temporal
  </text>
  <text class="muted" x="80" y="776" font-size="24">
    statement is <tspan font-style="italic">descriptive</tspan>: 4 weekly health points cannot support a statistical association.
  </text>

  <text class="muted" x="80" y="850" font-size="21" font-style="italic">
    Synthetic demonstration data. Co-located records — not causation.
  </text>
</svg>
