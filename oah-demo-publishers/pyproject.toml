[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oah-demo-publishers"
version = "0.1.0"
description = "Sample publishers for the OneAquaHealth ingestion gateway"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2,<3",
    "pika>=1.3,<2",
    "python-dotenv>=1,<2",
]

[project.scripts]
oah-demo-publish = "oah_demo_publishers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
