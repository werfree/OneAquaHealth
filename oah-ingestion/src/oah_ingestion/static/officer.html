<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surveillance Studio — OneAquaHealth</title>
<style>
  :root{
    --bg:#FFFFFF; --bg-2:#F5F5F7; --bg-3:#FAFAFC; --rail:#F7F7F9;
    --label:#1D1D1F; --label-2:#6E6E73; --label-3:#86868B;
    --sep:#D2D2D7; --sep-2:#E8E8ED;
    --blue:#0071E3; --blue-press:#0058B0; --blue-wash:#F0F7FF; --blue-edge:#CCE4FF;
    /* categorical, validated: CVD ΔE 24.7 / normal ΔE 33.6 on #FFFFFF */
    --water:#2a78d6; --health:#eb6834;
    /* sequential blue ramp, 100→700, for magnitude in the matrix */
    --s1:#cde2fb; --s2:#9ec5f4; --s3:#6da7ec; --s4:#3987e5; --s5:#256abf; --s6:#184f95;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --crit-w:#FFEBEC; --warn-w:#FFF6E5; --ok-w:#E9F7E9;
    --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -8px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--bg-2);color:var(--label);font-family:var(--text);
       font-size:14px;line-height:1.45;letter-spacing:-.008em;-webkit-font-smoothing:antialiased}
  button,select,input{font:inherit}
  button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--blue-edge);outline-offset:1px}

  /* ══ shell ══ */
  .app{display:grid;grid-template-rows:48px 1fr;height:100%}
  .top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bg);
       border-bottom:1px solid var(--sep-2);z-index:20}
  .logo{font-size:14px;font-weight:600;white-space:nowrap}
  .logo span{color:var(--label-3);font-weight:400}
  .crumbs{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--label-3);flex:1;min-width:0;overflow:hidden}
  .crumbs b{color:var(--label);font-weight:500}
  .top-r{display:flex;align-items:center;gap:8px}
  .live{font-size:11.5px;color:var(--label-2);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
  .dot.off{background:var(--label-3)}
  select{appearance:none;border:1px solid var(--sep);border-radius:7px;background:var(--bg);
         font-size:12.5px;padding:5px 24px 5px 9px;cursor:pointer;
         background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%2386868B' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
         background-repeat:no-repeat;background-position:right 8px center;background-size:9px}
  .btn{border:0;cursor:pointer;font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:99px;
       background:var(--blue);color:#fff;white-space:nowrap}
  .btn:hover{background:var(--blue-press)} .btn[disabled]{opacity:.4;cursor:default}
  .btn.g{background:var(--bg-2);color:var(--label);border:1px solid var(--sep)}
  .btn.g:hover{background:var(--sep-2)}

  .body{display:grid;grid-template-columns:188px 1fr 300px;height:100%;min-height:0}
  @media(max-width:1080px){.body{grid-template-columns:62px 1fr 260px}.rail-t,.rail-s{display:none}}
  @media(max-width:820px){.body{grid-template-columns:62px 1fr}.insp{display:none}}

  /* ══ rail: the investigation stages ══ */
  .rail{background:var(--rail);border-right:1px solid var(--sep-2);padding:12px 9px;
        display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .rail-h{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
          color:var(--label-3);padding:4px 8px 8px}
  .stage{display:flex;align-items:center;gap:10px;padding:8px 9px;border:0;background:transparent;
         border-radius:8px;cursor:pointer;text-align:left;width:100%;transition:background .15s;color:var(--label)}
  .stage:hover:not([disabled]){background:rgba(0,0,0,.04)}
  .stage[aria-current="true"]{background:var(--blue);color:#fff}
  .stage[aria-current="true"] .rail-s{color:rgba(255,255,255,.72)}
  .stage[disabled]{opacity:.38;cursor:default}
  .stage-i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
           font-size:11px;font-weight:600;background:rgba(0,0,0,.07)}
  .stage[aria-current="true"] .stage-i{background:rgba(255,255,255,.25)}
  .stage.done .stage-i{background:var(--ok-w);color:var(--good)}
  .stage[aria-current="true"].done .stage-i{background:rgba(255,255,255,.25);color:#fff}
  .rail-t{font-size:13px;font-weight:500;line-height:1.25}
  .rail-s{font-size:10.5px;color:var(--label-3);margin-top:1px}
  .rail-sp{flex:1}
  .rail-note{font-size:10.5px;color:var(--label-3);padding:8px;line-height:1.45}

  /* ══ canvas ══ */
  .canvas{overflow-y:auto;padding:16px;min-width:0;min-height:0}
  .empty{height:100%;display:grid;place-items:center;text-align:center}
  .empty-in{max-width:420px}
  .empty h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
  .empty p{color:var(--label-2);margin:0 0 20px;font-size:14.5px}
  .empty-ic{width:46px;height:46px;border-radius:12px;background:var(--blue-wash);color:var(--blue);
            display:grid;place-items:center;margin:0 auto 16px;font-size:21px}

  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  @media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
  .panel{background:var(--bg);border:1px solid var(--sep-2);border-radius:var(--r);
         box-shadow:var(--shadow);overflow:hidden;min-width:0}
  .ph{padding:10px 13px;border-bottom:1px solid var(--sep-2);display:flex;justify-content:space-between;
      align-items:center;gap:8px}
  .pt{font-size:12.5px;font-weight:600}
  .ps{font-size:11px;color:var(--label-3)}
  .pb{padding:12px 13px}

  .tile{padding:13px}
  .tile-l{font-size:11px;color:var(--label-3);font-weight:500}
  .tile-v{font-size:27px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;
          margin-top:2px;line-height:1.1}
  .tile-d{font-size:11.5px;margin-top:2px}
  .up{color:var(--critical)} .down{color:var(--good)} .flat{color:var(--label-3)}

  svg.v{display:block;width:100%;height:auto;overflow:visible}
  .ax{font-size:10px;fill:var(--label-3);font-family:var(--text)}
  .axb{font-size:10.5px;fill:var(--label);font-family:var(--text);font-weight:500}
  .gl{stroke:var(--sep-2);stroke-width:1}
  .thr{stroke-dasharray:4 3;stroke-width:1.5;fill:none}

  /* matrix */
  .mx{border-collapse:separate;border-spacing:3px;width:100%;font-size:11px}
  .mx th{font-weight:500;color:var(--label-3);font-size:10.5px;text-align:left;padding:0 4px 2px;white-space:nowrap}
  .mx th.rot{text-align:center}
  .mx td.lbl{color:var(--label);font-size:11.5px;white-space:nowrap;padding-right:6px;max-width:150px;
             overflow:hidden;text-overflow:ellipsis}
  .cell{border-radius:5px;text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums;
        cursor:pointer;font-weight:500;transition:transform .12s}
  .cell:hover{transform:scale(1.07)}
  .cell.na{background:var(--bg-2);color:var(--label-3)}

  /* lollipop */
  .lol-row{cursor:pointer}
  .lol-row:hover rect.hit{fill:rgba(0,0,0,.03)}

  .pill{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block}
  .p-c{background:var(--crit-w);color:var(--critical)}
  .p-w{background:var(--warn-w);color:#8a5a00}
  .p-o{background:var(--ok-w);color:#0a7a0a}
  .p-i{background:var(--bg-2);color:var(--label-2)}

  /* ══ inspector ══ */
  .insp{background:var(--bg);border-left:1px solid var(--sep-2);overflow-y:auto;min-width:0}
  .ih{padding:13px;border-bottom:1px solid var(--sep-2);position:sticky;top:0;background:var(--bg);z-index:2}
  .ih-t{font-size:14px;font-weight:600;letter-spacing:-.015em}
  .ih-s{font-size:11.5px;color:var(--label-3);margin-top:2px}
  .isec{padding:12px 13px;border-bottom:1px solid var(--sep-2)}
  .isec-h{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
          color:var(--label-3);margin-bottom:8px}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px;align-items:baseline}
  .kv-k{color:var(--label-2);min-width:0}
  .kv-v{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
  .spark{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;border-radius:6px}
  .spark:hover{background:var(--bg-3)}
  .spark-n{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spark svg{flex:none}
  .spark-v{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--label-2);white-space:nowrap}
  .acts{display:flex;flex-direction:column;gap:6px}
  .act{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--sep);border-radius:8px;
       background:var(--bg);cursor:pointer;text-align:left;text-decoration:none;color:inherit;font-size:12.5px;
       transition:border-color .15s}
  .act:hover{border-color:var(--blue);color:var(--blue)}
  .act-i{flex:none;opacity:.6}

  /* ══ report / ask ══ */
  .doc{padding:16px 18px;font-size:14px;line-height:1.6;max-width:70ch}
  .doc h3{font-size:13.5px;font-weight:600;margin:16px 0 5px}.doc h3:first-child{margin-top:0}
  .doc ul{margin:5px 0 11px;padding-left:19px}.doc li{margin-bottom:4px}
  .doc p{margin:0 0 10px}
  .muted{color:var(--label-3)}
  .spin{width:13px;height:13px;border:2px solid var(--sep);border-top-color:var(--blue);border-radius:50%;
        animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .thinking{display:flex;align-items:center;gap:8px;color:var(--label-2);font-size:13px;padding:14px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;
        border-radius:99px;background:var(--ok-w);color:#0a7a0a;border:1px solid rgba(12,163,12,.2)}
  .chip.bad{background:var(--crit-w);color:var(--critical);border-color:rgba(208,59,59,.25)}
  .askbar{display:flex;gap:7px;padding:10px 13px;border-bottom:1px solid var(--sep-2);background:var(--bg-3)}
  .askbar input{flex:1;min-width:0;border:1px solid var(--sep);border-radius:8px;padding:7px 11px;
                font-size:13.5px;background:var(--bg)}
  .sugs{display:flex;gap:6px;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid var(--sep-2)}
  .sugs button{border:1px solid var(--sep);background:var(--bg);cursor:pointer;font-size:11.5px;
               padding:4px 9px;border-radius:99px;color:var(--label-2)}
  .sugs button:hover{border-color:var(--blue);color:var(--blue)}
  .step{border-bottom:1px solid var(--sep-2)}
  .sbtn{width:100%;border:0;background:transparent;cursor:pointer;text-align:left;padding:9px 13px;
        display:flex;align-items:center;gap:9px}
  .sbtn:hover{background:var(--bg-3)}
  .sn{flex:none;width:19px;height:19px;border-radius:5px;background:var(--blue-wash);color:var(--blue);
      display:grid;place-items:center;font-family:var(--mono);font-size:10px}
  .stx{flex:1;font-size:12.5px;font-weight:500}
  .sx{font-size:11px;color:var(--label-3)}
  .chev{width:11px;color:var(--label-3);transition:transform .2s}
  .sbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .sbody{display:none;padding:0 13px 11px 41px;font-size:12.5px;color:var(--label-2)}
  .sbody.open{display:block}
  .sbody a{color:var(--blue);font-family:var(--mono);font-size:10.5px;word-break:break-all;display:block;margin-top:5px}
  .note{padding:11px 13px;background:var(--bg-2);font-size:11.5px;color:var(--label-2);line-height:1.5}
  .note b{color:var(--label)}

  #tip{position:fixed;z-index:300;background:rgba(29,29,31,.95);color:#fff;font-size:11.5px;padding:7px 10px;
       border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;line-height:1.5}
  #tip.on{opacity:1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--label-2);padding:0 13px 11px}
  .lg{display:flex;align-items:center;gap:6px}
  .sw{width:12px;height:3px;border-radius:2px}
  .sw.d{height:0;border-top:2px dashed currentColor;width:14px}
  @media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>
<div id="tip"></div>
<div class="app">

  <div class="top">
    <div class="logo">Surveillance Studio <span>· OneAquaHealth</span></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="top-r">
      <span class="live" id="live"><span class="dot off"></span>connecting…</span>
      <select id="win" aria-label="Time window">
        <option value="14">14 days</option><option value="28" selected>28 days</option><option value="60">60 days</option>
      </select>
      <button class="btn g" id="reset">Reset</button>
    </div>
  </div>

  <div class="body">
    <nav class="rail" id="rail">
      <div class="rail-h">Investigation</div>
      <button class="stage" data-stage="scan"><span class="stage-i">1</span><span><span class="rail-t">Scan</span><span class="rail-s">What needs attention</span></span></button>
      <button class="stage" data-stage="triage" disabled><span class="stage-i">2</span><span><span class="rail-t">Triage</span><span class="rail-s">Rank the wards</span></span></button>
      <button class="stage" data-stage="investigate" disabled><span class="stage-i">3</span><span><span class="rail-t">Investigate</span><span class="rail-s">Timeline and lag</span></span></button>
      <button class="stage" data-stage="correlate" disabled><span class="stage-i">4</span><span><span class="rail-t">Correlate</span><span class="rail-s">Across all wards</span></span></button>
      <button class="stage" data-stage="conclude" disabled><span class="stage-i">5</span><span><span class="rail-t">Conclude</span><span class="rail-s">Brief and evidence</span></span></button>
      <div class="rail-sp"></div>
      <div class="rail-note">Screening against CPCB bathing-water criteria and IS 10500:2012. Demonstration data.</div>
    </nav>

    <main class="canvas" id="canvas"></main>

    <aside class="insp" id="insp"></aside>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"—":Math.abs(n)>=10000?Math.round(n).toLocaleString():Math.abs(n)>=100?String(Math.round(n)):String(+n.toFixed(2));
const tip=$("#tip");
const hover=(el,html)=>{
  el.addEventListener("mousemove",e=>{tip.innerHTML=html;tip.style.left=Math.min(innerWidth-230,e.clientX+13)+"px";
    tip.style.top=(e.clientY-8)+"px";tip.classList.add("on");});
  el.addEventListener("mouseleave",()=>tip.classList.remove("on"));
};

const LBL={faecal_coliform:"Faecal coliform",bod:"BOD",dissolved_oxygen:"Dissolved oxygen",
  ammoniacal_nitrogen:"Ammoniacal N",ph:"pH",chromium_total:"Chromium",
  acute_diarrhoeal_disease:"Acute diarrhoeal disease",enteric_fever:"Enteric fever",
  viral_hepatitis_a_e:"Viral hepatitis A/E",cholera:"Cholera"};
const SHORT={faecal_coliform:"Coliform",bod:"BOD",dissolved_oxygen:"DO",ammoniacal_nitrogen:"NH₃-N",ph:"pH",chromium_total:"Cr"};
const RAMP=["--s1","--s2","--s3","--s4","--s5","--s6"];

let WIN=28, DATA=null, SEL=null, STAGE=null, DONE=new Set(), IND="faecal_coliform";

/* ══ stage machinery ══ */
const STAGES=["scan","triage","investigate","correlate","conclude"];
const TITLES={scan:"Scan",triage:"Triage",investigate:"Investigate",correlate:"Correlate",conclude:"Conclude"};
function unlock(s){DONE.add(s);paintRail();}
function available(s){
  if(s==="scan")return true;
  if(s==="triage")return DONE.has("scan");
  if(s==="investigate")return DONE.has("scan")&&!!SEL;
  if(s==="correlate")return DONE.has("scan");
  if(s==="conclude")return DONE.has("scan");
  return false;
}
function paintRail(){
  $$(".stage").forEach(b=>{
    const s=b.dataset.stage;
    b.disabled=!available(s);
    b.setAttribute("aria-current",String(s===STAGE));
    b.classList.toggle("done",DONE.has(s));
  });
  const parts=[`<b>${esc(TITLES[STAGE]||"")}</b>`];
  if(SEL&&DATA){const w=DATA.wards.find(x=>x.site_id===SEL); if(w)parts.push(esc(w.name));}
  if(STAGE==="investigate")parts.push(esc(LBL[IND]||IND));
  $("#crumbs").innerHTML=parts.join(" <span>›</span> ");
}
function go(s){ if(!available(s))return; STAGE=s; paintRail(); render(); }
$$(".stage").forEach(b=>b.onclick=()=>go(b.dataset.stage));
$("#win").onchange=e=>{WIN=+e.target.value;DATA=null;DONE.clear();SEL=null;go("scan");};
$("#reset").onclick=()=>{DATA=null;DONE.clear();SEL=null;IND="faecal_coliform";go("scan");};

/* ══ data ══ */
async function loadWards(){
  const r=await fetch(`/api/officer/wards?days=${WIN}`);
  DATA=await r.json();
  $("#live").innerHTML='<span class="dot"></span>'+esc(DATA.fhir_server.replace(/^https?:\/\//,""));
  return DATA;
}

/* ══ render ══ */
function render(){
  const c=$("#canvas");
  if(STAGE==="scan")        return DATA?scan(c):scanEmpty(c);
  if(STAGE==="triage")      return triage(c);
  if(STAGE==="investigate") return investigate(c);
  if(STAGE==="correlate")   return correlate(c);
  if(STAGE==="conclude")    return conclude(c);
}

/* ── 1. SCAN ── */
function scanEmpty(c){
  c.innerHTML=`<div class="empty"><div class="empty-in">
    <div class="empty-ic">◎</div>
    <h2>Begin a scan</h2>
    <p>Reads every monitoring station in the district from the FHIR repository and screens the latest
       readings against CPCB criteria. Nothing is pre-computed.</p>
    <button class="btn" id="run">Scan ${WIN} days</button>
  </div></div>`;
  inspector("");
  $("#run").onclick=async()=>{
    $("#run").disabled=true;$("#run").textContent="Reading repository…";
    await loadWards(); unlock("scan"); go("scan");
  };
}

function scan(c){
  const w=DATA.wards;
  const exc=w.reduce((n,x)=>n+x.exceedances.length,0);
  const high=w.filter(x=>x.severity==="HIGH").length;
  const pri=DATA.priority.length;
  const rising=w.filter(x=>(x.add_change_pct||0)>0).length;

  // severity matrix: station × indicator, sequential ramp on exceedance factor.
  const inds=[...new Set(w.flatMap(x=>Object.keys(x.readings||{})))];
  const cellBg=f=>{ if(f==null)return "var(--ok-w)";
    const i=f<1.5?0:f<2.5?1:f<4?2:f<6?3:f<10?4:5; return `var(${RAMP[i]})`; };
  const cellFg=f=>(f!=null&&f>=4)?"#fff":"var(--label)";

  c.innerHTML=`
  <div class="grid g4" style="margin-bottom:12px">
    ${[["Stations",w.length,"monitored this window"],
       ["Exceedances",exc,`across ${high} station${high===1?"":"s"} at HIGH`],
       ["Wards rising",rising,"notifications up vs prior"],
       ["Priority",pri,pri?"water and cases together":"none co-located"]]
      .map(([l,v,d],i)=>`<div class="panel tile"><div class="tile-l">${l}</div>
        <div class="tile-v" ${i===3&&pri?'style="color:var(--critical)"':""}>${v}</div>
        <div class="tile-d muted">${esc(d)}</div></div>`).join("")}
  </div>

  <div class="panel">
    <div class="ph"><span class="pt">Severity matrix</span>
      <span class="ps">latest reading per indicator · shade = multiple of its criterion</span></div>
    <div class="pb" style="overflow-x:auto">
      <table class="mx"><thead><tr><th></th>
        ${inds.map(i=>`<th class="rot">${esc(SHORT[i]||i)}</th>`).join("")}
        <th class="rot">ADD Δ</th></tr></thead><tbody>
        ${w.map(x=>`<tr data-site="${esc(x.site_id)}">
          <td class="lbl">${esc(x.name)}</td>
          ${inds.map(i=>{const r=(x.readings||{})[i];
            if(!r)return `<td class="cell na" data-t="${esc(SHORT[i]||i)}: not measured">–</td>`;
            return `<td class="cell" style="background:${cellBg(r.factor)};color:${cellFg(r.factor)}"
              data-t="${esc(x.name)} · ${esc(LBL[i]||i)}<br>${fmt(r.value)} ${esc(r.unit||"")}${r.factor?` · ${r.factor}× criterion`:" · within criteria"}">
              ${r.factor?r.factor+"×":"✓"}</td>`;}).join("")}
          <td class="cell" style="background:${x.add_change_pct>15?"var(--crit-w)":x.add_change_pct>0?"var(--warn-w)":"var(--bg-2)"};
              color:${x.add_change_pct>15?"var(--critical)":"var(--label)"}"
              data-t="Acute diarrhoeal disease change vs prior period">
            ${x.add_change_pct==null?"–":(x.add_change_pct>0?"+":"")+x.add_change_pct+"%"}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:var(--ok-w);height:11px;width:11px;border-radius:3px"></span>within criteria</span>
      ${[["<1.5×","--s1"],["2.5×","--s2"],["4×","--s3"],["6×","--s4"],["10×","--s5"],["≥10×","--s6"]]
        .map(([l,v])=>`<span class="lg"><span class="sw" style="background:var(${v});height:11px;width:11px;border-radius:3px"></span>${l}</span>`).join("")}
    </div>
  </div>`;

  $$(".cell[data-t]").forEach(el=>hover(el,el.dataset.t));
  $$("tr[data-site]").forEach(tr=>tr.onclick=()=>{SEL=tr.dataset.site;unlock("triage");go("triage");});
  inspector("scan");
}

/* ── 2. TRIAGE: ranked lollipop ── */
function triage(c){
  const w=[...DATA.wards];
  const worst=x=>Math.max(0,...x.exceedances.map(e=>e.exceedance_factor||0));
  const max=Math.max(1,...w.map(worst));
  const H=w.length*38+34, W=860, L=176, R=58;

  c.innerHTML=`
  <div class="panel">
    <div class="ph"><span class="pt">Wards by worst exceedance</span>
      <span class="ps">bar = multiple of criterion · dot = change in notified ADD</span></div>
    <div class="pb">
      <svg class="v" viewBox="0 0 ${W} ${H}">
        ${[0,.25,.5,.75,1].map(t=>{const x=L+t*(W-L-R);
          return `<line class="gl" x1="${x}" y1="18" x2="${x}" y2="${H-16}"/>
                  <text class="ax" x="${x}" y="12" text-anchor="middle">${(t*max).toFixed(1)}×</text>`;}).join("")}
        ${w.map((x,i)=>{
          const y=30+i*38, f=worst(x), bw=(f/max)*(W-L-R);
          const col=f>=4?"var(--critical)":f>=2?"var(--warning)":f>0?"var(--s3)":"var(--sep)";
          const ch=x.add_change_pct;
          const dx=L+(W-L-R)+22;
          return `<g class="lol-row" data-site="${esc(x.site_id)}" tabindex="0">
            <rect class="hit" x="0" y="${y-15}" width="${W}" height="32" fill="transparent" rx="5"/>
            <text class="axb" x="${L-10}" y="${y+4}" text-anchor="end">${esc(x.name.length>26?x.name.slice(0,25)+"…":x.name)}</text>
            <line x1="${L}" y1="${y}" x2="${L+Math.max(bw,1)}" y2="${y}" stroke="${col}" stroke-width="7" stroke-linecap="round"/>
            <circle cx="${L+Math.max(bw,1)}" cy="${y}" r="6" fill="${col}" stroke="#fff" stroke-width="2"/>
            <text class="ax" x="${L+Math.max(bw,1)+13}" y="${y+3.5}" fill="var(--label-2)">${f?f.toFixed(1)+"×":"ok"}</text>
            <text class="ax" x="${dx}" y="${y+3.5}" text-anchor="end"
              fill="${ch>15?"var(--critical)":ch>0?"var(--warning)":"var(--label-3)"}" font-weight="600">
              ${ch==null?"–":(ch>0?"+":"")+ch+"%"}</text>
            ${x.co_located?`<circle cx="${dx+12}" cy="${y}" r="4" fill="var(--critical)"/>`:""}
          </g>`;}).join("")}
      </svg>
    </div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:var(--critical)"></span>≥4× criterion</span>
      <span class="lg"><span class="sw" style="background:var(--warning)"></span>≥2×</span>
      <span class="lg"><span class="sw" style="background:var(--s3)"></span>exceeds</span>
      <span class="lg"><span style="width:8px;height:8px;border-radius:50%;background:var(--critical);display:inline-block"></span>water and cases together</span>
    </div>
  </div>`;

  $$(".lol-row").forEach(g=>{
    const x=DATA.wards.find(a=>a.site_id===g.dataset.site);
    hover(g,`${esc(x.name)}<br>${x.exceedances.length} exceedance(s) · ADD ${x.add_change_pct==null?"–":x.add_change_pct+"%"}`);
    const pick=()=>{SEL=g.dataset.site;unlock("triage");go("investigate");};
    g.onclick=pick; g.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();pick();}};
  });
  inspector("triage");
}

/* ── 3. INVESTIGATE: two aligned panels, one shared time axis ──
   Never a dual y-axis: coliform runs to tens of thousands and case rate to
   tens, so a shared scale flattens one series onto the baseline and the
   comparison becomes a lie. The lag reads as horizontal offset. */
async function investigate(c){
  const w=DATA.wards.find(x=>x.site_id===SEL);
  const opts=Object.keys(w.readings||{});
  if(!opts.includes(IND))IND=opts[0]||"faecal_coliform";
  c.innerHTML=`<div class="panel">
    <div class="ph"><span class="pt">${esc(w.name)}</span>
      <select id="ind">${opts.map(i=>`<option value="${esc(i)}"${i===IND?" selected":""}>${esc(LBL[i]||i)}</option>`).join("")}</select></div>
    <div class="pb"><div class="thinking"><span class="spin"></span>Reading series…</div></div></div>`;
  $("#ind").onchange=e=>{IND=e.target.value;investigate(c);};

  const [wt,ht]=await Promise.all([
    fetch(`/api/officer/trend?site_id=${SEL}&indicator=${IND}&days=${WIN}`).then(r=>r.json()),
    fetch(`/api/officer/trend?site_id=${SEL}&indicator=acute_diarrhoeal_disease&days=${WIN}`).then(r=>r.json())
  ]);
  unlock("investigate");

  const W=900,H=330,L=58,R=16,T=20,GAP=40;
  const PH=(H-T-GAP-26)/2, top={y:T,h:PH}, bot={y:T+PH+GAP,h:PH};
  const ws=wt.series||[], hs=ht.series||[];
  const dates=[...new Set([...ws.map(p=>p.date),...hs.map(p=>p.date)])].sort();
  const X=d=>L+(dates.indexOf(d)/Math.max(1,dates.length-1))*(W-L-R);
  const sc=(pts,pn,thr)=>{const v=pts.map(p=>p.value).filter(x=>x!=null);
    if(thr!=null)v.push(thr); let lo=Math.min(...v),hi=Math.max(...v);
    if(lo===hi){lo*=.9;hi=hi*1.1||1;} const pad=(hi-lo)*.14; lo=Math.max(0,lo-pad);hi+=pad;
    return {lo,hi,y:x=>pn.y+pn.h-((x-lo)/(hi-lo))*pn.h};};
  const thr=typeof wt.threshold==="number"?wt.threshold:null;
  const A=sc(ws,top,thr), B=sc(hs,bot,null);
  const base=hs.find(p=>p.baseline!=null)?.baseline??null;
  const path=(p,s)=>p.filter(x=>x.value!=null).map((x,i)=>`${i?"L":"M"}${X(x.date).toFixed(1)},${s.y(x.value).toFixed(1)}`).join(" ");
  const tk=s=>[0,.5,1].map(t=>s.lo+(s.hi-s.lo)*t);
  const step=Math.max(1,Math.ceil(dates.length/8));

  c.innerHTML=`<div class="panel">
    <div class="ph"><span class="pt">${esc(w.name)}</span>
      <select id="ind">${opts.map(i=>`<option value="${esc(i)}"${i===IND?" selected":""}>${esc(LBL[i]||i)}</option>`).join("")}</select></div>
    <div class="pb">
      <svg class="v" viewBox="0 0 ${W} ${H}">
        ${[top,bot].map((pn,k)=>{const s=k?B:A;return tk(s).map(v=>
          `<line class="gl" x1="${L}" y1="${s.y(v).toFixed(1)}" x2="${W-R}" y2="${s.y(v).toFixed(1)}"/>
           <text class="ax" x="${L-8}" y="${(s.y(v)+3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join("");}).join("")}
        <text class="axb" x="${L}" y="${top.y-7}">${esc(LBL[wt.indicator]||wt.indicator)} <tspan class="ax">${esc(wt.unit||"")}</tspan></text>
        <text class="axb" x="${L}" y="${bot.y-7}">Acute diarrhoeal disease <tspan class="ax">per 100,000 · weekly</tspan></text>
        ${thr!=null?`<line class="thr" stroke="var(--critical)" x1="${L}" y1="${A.y(thr).toFixed(1)}" x2="${W-R}" y2="${A.y(thr).toFixed(1)}"/>
          <text class="ax" fill="var(--critical)" x="${W-R}" y="${(A.y(thr)-5).toFixed(1)}" text-anchor="end">CPCB ${fmt(thr)}</text>`:""}
        ${base!=null?`<line class="thr" stroke="var(--label-3)" x1="${L}" y1="${B.y(base).toFixed(1)}" x2="${W-R}" y2="${B.y(base).toFixed(1)}"/>
          <text class="ax" x="${W-R}" y="${(B.y(base)-5).toFixed(1)}" text-anchor="end">baseline ${fmt(base)}</text>`:""}
        <path d="${path(ws,A)}" fill="none" stroke="var(--water)" stroke-width="2" stroke-linejoin="round"/>
        <path d="${path(hs,B)}" fill="none" stroke="var(--health)" stroke-width="2" stroke-linejoin="round"/>
        ${hs.filter(p=>p.value!=null).map(p=>`<circle cx="${X(p.date).toFixed(1)}" cy="${B.y(p.value).toFixed(1)}" r="4"
          fill="var(--health)" stroke="#fff" stroke-width="2"/>`).join("")}
        ${dates.filter((_,i)=>i%step===0||i===dates.length-1).map(d=>
          `<text class="ax" x="${X(d).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.slice(5)}</text>`).join("")}
        <line id="cx" x1="0" y1="${T}" x2="0" y2="${bot.y+bot.h}" stroke="var(--label-3)" stroke-width="1" opacity="0"/>
        <rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${bot.y+bot.h-T}" fill="transparent"/>
      </svg>
    </div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:var(--water)"></span>${esc(LBL[wt.indicator]||wt.indicator)} — daily</span>
      <span class="lg"><span class="sw" style="background:var(--health)"></span>Acute diarrhoeal disease — weekly</span>
      ${thr!=null?'<span class="lg" style="color:var(--critical)"><span class="sw d"></span>CPCB criterion</span>':""}
      ${base!=null?'<span class="lg"><span class="sw d" style="color:var(--label-3)"></span>baseline</span>':""}
    </div>
    ${wt.threshold_basis?`<div class="note"><b>Criterion.</b> ${esc(wt.threshold_basis)}</div>`:""}
  </div>`;
  $("#ind").onchange=e=>{IND=e.target.value;investigate(c);};

  const hit=$("#hit"),cx=$("#cx"),svg=c.querySelector("svg");
  hit.onmousemove=e=>{const r=svg.getBoundingClientRect();
    const i=Math.round(((e.clientX-r.left)/r.width*W-L)/(W-L-R)*(dates.length-1));
    const d=dates[Math.max(0,Math.min(dates.length-1,i))];if(!d)return;
    cx.setAttribute("x1",X(d));cx.setAttribute("x2",X(d));cx.setAttribute("opacity",".3");
    const a=ws.find(p=>p.date===d),b=hs.find(p=>p.date===d);
    tip.innerHTML=`<div style="opacity:.65;margin-bottom:2px">${esc(d)}</div>`+
      (a?`<div>${esc(LBL[wt.indicator]||wt.indicator)} <b>${fmt(a.value)}</b></div>`:"")+
      (b?`<div>ADD <b>${fmt(b.value)}</b>/100k${b.cases?` · ${b.cases} cases`:""}</div>`:"");
    tip.style.left=Math.min(innerWidth-220,e.clientX+13)+"px";tip.style.top=(e.clientY-8)+"px";tip.classList.add("on");};
  hit.onmouseleave=()=>{cx.setAttribute("opacity","0");tip.classList.remove("on");};
  inspector("investigate",{wt,ht});
}

/* ── 4. CORRELATE: scatter across wards ── */
function correlate(c){
  const w=DATA.wards.filter(x=>x.add_change_pct!=null);
  const worst=x=>Math.max(0,...x.exceedances.map(e=>e.exceedance_factor||0));
  const W=860,H=400,L=58,R=26,T=22,B=46;
  const mx=Math.max(2,...w.map(worst))*1.1;
  const chs=w.map(x=>x.add_change_pct);
  const lo=Math.min(-10,...chs)*1.15, hi=Math.max(20,...chs)*1.15;
  const X=f=>L+(f/mx)*(W-L-R), Y=p=>T+(1-(p-lo)/(hi-lo))*(H-T-B);
  const col=x=>x.severity==="HIGH"?"var(--critical)":x.severity==="MODERATE"?"var(--warning)":"var(--good)";

  c.innerHTML=`<div class="panel">
    <div class="ph"><span class="pt">Water exceedance against change in notifications</span>
      <span class="ps">one point per ward · upper right is the quadrant that matters</span></div>
    <div class="pb">
      <svg class="v" viewBox="0 0 ${W} ${H}">
        <rect x="${X(1)}" y="${T}" width="${W-R-X(1)}" height="${Y(15)-T}" fill="var(--crit-w)" opacity=".55"/>
        <text class="ax" x="${W-R-8}" y="${T+14}" text-anchor="end" fill="var(--critical)">exceeds criteria and notifications rising</text>
        ${[0,.25,.5,.75,1].map(t=>{const x=L+t*(W-L-R);return `<line class="gl" x1="${x}" y1="${T}" x2="${x}" y2="${H-B}"/>
          <text class="ax" x="${x}" y="${H-B+15}" text-anchor="middle">${(t*mx).toFixed(1)}×</text>`;}).join("")}
        ${[lo,0,hi].map(v=>`<line class="gl" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"
          ${v===0?'stroke="var(--sep)" stroke-width="1.5"':""}/>
          <text class="ax" x="${L-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${v>0?"+":""}${Math.round(v)}%</text>`).join("")}
        <text class="ax" x="${L+(W-L-R)/2}" y="${H-10}" text-anchor="middle">worst exceedance (multiple of criterion) →</text>
        <text class="ax" x="14" y="${T+(H-T-B)/2}" text-anchor="middle" transform="rotate(-90 14 ${T+(H-T-B)/2})">change in notified ADD →</text>
        ${w.map(x=>{const cx=X(worst(x)),cy=Y(x.add_change_pct);
          return `<g class="lol-row" data-site="${esc(x.site_id)}" tabindex="0">
            <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${x.co_located?11:8}" fill="${col(x)}"
              fill-opacity="${x.co_located?".95":".7"}" stroke="#fff" stroke-width="2"/>
            <text class="ax" x="${(cx+15).toFixed(1)}" y="${(cy+3.5).toFixed(1)}" fill="var(--label)">${esc(x.name.split(" at ")[1]||x.name.slice(0,16))}</text>
          </g>`;}).join("")}
      </svg>
    </div>
    <div class="legend">
      <span class="lg"><span style="width:9px;height:9px;border-radius:50%;background:var(--critical);display:inline-block"></span>HIGH</span>
      <span class="lg"><span style="width:9px;height:9px;border-radius:50%;background:var(--warning);display:inline-block"></span>MODERATE</span>
      <span class="lg"><span style="width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block"></span>within criteria</span>
      <span class="lg">larger point = water and cases together</span>
    </div>
    <div class="note"><b>Association only.</b> Position in the shaded quadrant is a reason to sample, not evidence
      that river condition caused the notified cases.</div>
  </div>`;
  $$(".lol-row").forEach(g=>{
    const x=DATA.wards.find(a=>a.site_id===g.dataset.site);
    hover(g,`${esc(x.name)}<br>${worst(x).toFixed(1)}× criterion · ADD ${x.add_change_pct>0?"+":""}${x.add_change_pct}%`);
    g.onclick=()=>{SEL=g.dataset.site;go("investigate");};
  });
  unlock("correlate"); inspector("correlate");
}

/* ── 5. CONCLUDE ── */
function conclude(c){
  c.innerHTML=`
  <div class="panel" style="margin-bottom:12px">
    <div class="ph"><span class="pt">Executive situation report</span>
      <button class="btn" id="gen">Generate</button></div>
    <div class="doc" id="rep"><span class="muted">Figures are derived in Python; the model writes prose over
      facts it cannot alter, and the result is checked back against them.</span></div>
    <div id="repg"></div>
  </div>
  <div class="panel">
    <div class="askbar"><input id="q" placeholder="Ask the repository…" autocomplete="off">
      <button class="btn" id="askb">Ask</button></div>
    <div class="sugs" id="sugs"></div>
    <div id="trace"></div>
    <div class="doc" id="ans"><span class="muted">No question asked yet.</span></div>
    <div id="ansg"></div>
  </div>`;
  unlock("conclude");

  const SUG=["Which ward has both a water exceedance and rising notifications?",
    "Has faecal coliform changed at the ITO reach this month?",
    "What is the dissolved oxygen trend at Okhla?"];
  $("#sugs").innerHTML=SUG.map(q=>`<button>${esc(q)}</button>`).join("");
  $$("#sugs button").forEach(b=>b.onclick=()=>{$("#q").value=b.textContent;ask();});
  $("#gen").onclick=genReport; $("#askb").onclick=ask;
  $("#q").addEventListener("keydown",e=>{if(e.key==="Enter")ask();});
  inspector("conclude");
}

const md=t=>esc(t).replace(/^\*\*(.+?)\*\*$/gm,"<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
  .replace(/^[-*]\s+(.+)$/gm,"<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,"<ul>$1</ul>")
  .split(/\n{2,}/).map(b=>b.startsWith("<")?b:`<p>${b}</p>`).join("");
const gchip=g=>!g?"":`<div class="note"><span class="chip ${g.grounded?"":"bad"}">${g.grounded?"✓":"⚠"}
  ${g.grounded?`Grounded · ${g.figures_checked} figure(s) verified against ${g.source_figure_count}`
             :`${g.unsupported_figures.length} figure(s) not in the data`}</span>
  <span style="margin-left:8px">${esc(g.not_covered)}</span></div>`;

async function genReport(){
  $("#gen").disabled=true;
  $("#rep").innerHTML='<div class="thinking" style="padding:0"><span class="spin"></span>Deriving facts, then drafting…</div>';
  try{const r=await fetch(`/api/officer/report?days=${WIN}`);const d=await r.json();
    if(!r.ok)throw new Error(d.detail||"failed");
    $("#rep").innerHTML=md(d.narrative); $("#repg").innerHTML=gchip(d.grounding);
  }catch(e){$("#rep").innerHTML=`<span class="muted">${esc(e.message)}</span>`;}
  $("#gen").disabled=false;
}

const WHY={list_sites:"Established which stations exist before narrowing.",
  get_thresholds:"Fetched the CPCB and IS 10500 criteria rather than recalling a number.",
  get_site_profile:"Pulled water chemistry and cohort health together — the cross-domain join.",
  search_observations:"Filtered Observations by profile, indicator, station and date.",
  get_cohort:"Resolved the ward cohort a health measure points at."};
const NAME={list_sites:()=>"Surveyed the stations",get_thresholds:()=>"Loaded the screening criteria",
  get_site_profile:g=>g.n>1?`Examined ${g.n} stations`:"Examined one station in full",
  search_observations:g=>g.n>1?`Ran ${g.n} targeted searches`:"Ran a targeted search",
  get_cohort:()=>"Resolved the ward cohort"};

async function ask(){
  const q=$("#q").value.trim(); if(!q)return;
  $("#askb").disabled=true;$("#trace").innerHTML="";$("#ansg").innerHTML="";
  $("#ans").innerHTML='<div class="thinking" style="padding:0"><span class="spin"></span>Choosing tools and querying FHIR…</div>';
  let d;
  try{const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
    d=await r.json(); if(!r.ok)throw new Error(d.detail||"failed");
  }catch(e){$("#ans").innerHTML=`<span class="muted">${esc(e.message)}</span>`;$("#askb").disabled=false;return;}

  const gs=[];
  d.trace.forEach(t=>{const us=(t.fhir_urls&&t.fhir_urls.length)?t.fhir_urls:(t.fhir_url?[t.fhir_url]:[]);
    const g=gs.find(g=>g.tool===t.tool); if(g){g.n++;g.urls.push(...us);}else gs.push({tool:t.tool,n:1,urls:[...us]});});
  $("#trace").innerHTML=gs.map((g,i)=>{const u=[...new Set(g.urls.filter(Boolean))];
    return `<div class="step"><button class="sbtn" aria-expanded="false" data-t="t${i}">
      <span class="sn">${i+1}</span><span class="stx">${esc((NAME[g.tool]||(()=>g.tool))(g))}</span>
      <span class="sx">${u.length?u.length+" quer"+(u.length>1?"ies":"y"):"local"}</span>
      <svg class="chev" viewBox="0 0 8 13" fill="none"><path d="M1.5 1.5L6.5 6.5L1.5 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button><div class="sbody" id="t${i}">${esc(WHY[g.tool]||"Tool call.")}
      ${u.slice(0,3).map(x=>`<a href="${esc(x)}" target="_blank" rel="noopener">${esc(decodeURIComponent(x))}</a>`).join("")}</div></div>`;}).join("");
  $$("[data-t]").forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")==="true";
    b.setAttribute("aria-expanded",String(!o));$("#"+b.dataset.t).classList.toggle("open",!o);});
  $("#ans").innerHTML=md(d.answer); $("#ansg").innerHTML=gchip(d.grounding);
  $("#askb").disabled=false;
}

/* ══ inspector ══ */
function sparkline(series,colour){
  const v=series.map(p=>p.value).filter(x=>x!=null); if(v.length<2)return "";
  const lo=Math.min(...v),hi=Math.max(...v),W=58,H=18;
  const d=v.map((x,i)=>`${i?"L":"M"}${(i/(v.length-1)*W).toFixed(1)},${(H-(hi===lo?.5:(x-lo)/(hi-lo))*H).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${colour}" stroke-width="1.5"/></svg>`;
}

function inspector(stage,extra){
  const el=$("#insp");
  if(!DATA||!stage){ el.innerHTML=`<div class="ih"><div class="ih-t">Nothing selected</div>
    <div class="ih-s">Run a scan to begin.</div></div>`; return; }
  const w=SEL?DATA.wards.find(x=>x.site_id===SEL):null;

  if(!w){ el.innerHTML=`<div class="ih"><div class="ih-t">District overview</div>
      <div class="ih-s">${DATA.wards.length} stations · ${WIN} days</div></div>
    <div class="isec"><div class="isec-h">Priority</div>
      ${DATA.priority.length?DATA.priority.map(id=>{const x=DATA.wards.find(a=>a.site_id===id);
        return `<div class="kv"><span class="kv-k">${esc(x.name)}</span><span class="pill p-c">both</span></div>`;}).join("")
        :'<div class="muted" style="font-size:12.5px">No ward currently shows a water exceedance together with rising notifications.</div>'}</div>
    <div class="isec"><div class="isec-h">Select a station</div>
      ${DATA.wards.map(x=>`<div class="kv" style="cursor:pointer" data-pick="${esc(x.site_id)}">
        <span class="kv-k">${esc(x.name)}</span><span class="kv-v">${esc(x.severity)}</span></div>`).join("")}</div>`;
    $$("[data-pick]").forEach(d=>d.onclick=()=>{SEL=d.dataset.pick;paintRail();inspector(stage);if(STAGE==="investigate")investigate($("#canvas"));});
    return;
  }

  const exc=w.exceedances;
  el.innerHTML=`
  <div class="ih"><div class="ih-t">${esc(w.name)}</div>
    <div class="ih-s">${esc(w.district||"")} · ${esc(w.reach||"")}</div></div>

  <div class="isec"><div class="isec-h">Standing</div>
    <div class="kv"><span class="kv-k">Severity</span><span class="pill ${w.severity==="HIGH"?"p-c":w.severity==="MODERATE"?"p-w":"p-o"}">${esc(w.severity)}</span></div>
    <div class="kv"><span class="kv-k">Exceedances</span><span class="kv-v">${exc.length}</span></div>
    <div class="kv"><span class="kv-k">Readings</span><span class="kv-v">${w.water_readings}</span></div>
    <div class="kv"><span class="kv-k">ADD change</span><span class="kv-v ${w.add_change_pct>0?"up":w.add_change_pct<0?"down":"flat"}">
      ${w.add_change_pct==null?"—":(w.add_change_pct>0?"+":"")+w.add_change_pct+"%"}</span></div>
    ${w.add_cases!=null?`<div class="kv"><span class="kv-k">Cases, latest return</span><span class="kv-v">${w.add_cases}</span></div>`:""}
    ${w.cohort?`<div class="kv"><span class="kv-k">Cohort</span><span class="kv-v" style="font-size:11px">${esc(w.cohort)}</span></div>`:""}
  </div>

  <div class="isec"><div class="isec-h">Latest readings</div>
    ${Object.entries(w.readings||{}).map(([i,r])=>`
      <div class="spark" data-ind="${esc(i)}">
        <span class="spark-n">${esc(LBL[i]||i)}</span>
        <span class="spark-v" style="color:${r.exceeds?"var(--critical)":"var(--label-2)"}">${fmt(r.value)}${r.factor?` · ${r.factor}×`:""}</span>
      </div>`).join("")}
  </div>

  ${exc.length?`<div class="isec"><div class="isec-h">Criteria breached</div>
    ${exc.map(e=>`<div style="margin-bottom:9px">
      <div class="kv"><span class="kv-k">${esc(LBL[e.indicator]||e.indicator)}</span>
        <span class="kv-v" style="color:var(--critical)">${fmt(e.value)} ${esc(e.unit||"")}</span></div>
      <div class="muted" style="font-size:11px;line-height:1.4">${esc(e.basis)}</div></div>`).join("")}
  </div>`:""}

  <div class="isec"><div class="isec-h">Actions</div><div class="acts">
    <a class="act" href="/api/officer/export/bundle.json?site_id=${esc(w.site_id)}&days=${WIN}" download>
      <span class="act-i">⤓</span>Evidence bundle · FHIR R4</a>
    <a class="act" href="/api/officer/export/readings.csv?days=${WIN}&site_id=${esc(w.site_id)}" download>
      <span class="act-i">⤓</span>Readings · CSV</a>
    <a class="act" href="/api/officer/export/surveillance.csv?days=90" download>
      <span class="act-i">⤓</span>IDSP returns · CSV</a>
    <a class="act" href="/api/officer/report/facts?days=${WIN}" target="_blank" rel="noopener">
      <span class="act-i">↗</span>Derived facts · JSON</a>
  </div></div>`;

  $$("[data-ind]").forEach(d=>d.onclick=()=>{IND=d.dataset.ind;go("investigate");});
}

/* ══ boot ══ */
(async()=>{
  try{ const i=await (await fetch("/api/info")).json();
       $("#live").innerHTML='<span class="dot"></span>'+esc(i.fhir.server.replace(/^https?:\/\//,"")); }
  catch(e){ $("#live").innerHTML='<span class="dot off"></span>gateway unreachable'; }
  go("scan");
})();
</script>
</body>
</html>
