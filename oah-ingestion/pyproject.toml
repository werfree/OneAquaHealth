[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oah-ingestion"
version = "0.1.0"
description = "Reusable OneAquaHealth data ingestion and RabbitMQ publishing core"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "pika>=1.3,<2",
    "paho-mqtt>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
