[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oah-ingestion"
version = "0.1.0"
description = "OneAquaHealth multi-channel data ingestion application"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "oah-pydantic-models",
    "pika>=1.3,<2",
    "paho-mqtt>=2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oah_ingestion = ["static/*"]
